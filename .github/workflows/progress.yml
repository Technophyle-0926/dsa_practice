# Runs when you (the owner) push to main directly, e.g. tool or signature changes.
name: Update progress

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    environment: main-writer
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy key (environment secret, main only) that is allowed to push to the protected main.
          ssh-key: ${{ secrets.PROGRESS_DEPLOY_KEY }}
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart run tool/progress.dart
      - name: Commit if changed
        run: |
          git add -A PROGRESS.md LEADERBOARD.md progress '*/README.md'
          if git diff --cached --quiet; then
            echo "No progress changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update progress [skip ci]"
          git push
